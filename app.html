<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado de los Verbos</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" type="image/png" href="alex-icon-192.png">
<link rel="apple-touch-icon" href="alex-icon-192.png">
<meta name="theme-color" content="#7b4b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mercado Verbos">
<style>
:root{background:#f7e8a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(6px,2vw,24px);background:#f7e8a7}.welcome{position:relative;width:min(1200px,100%)}.hero{display:block;width:100%;height:auto}.enter{position:absolute;left:62.5%;top:59%;width:32.5%;height:12%;border-radius:999px}.enter:focus-visible{outline:clamp(2px,.35vw,5px) solid #fff;outline-offset:clamp(1px,.2vw,3px)}</style>
</head>
<body>
<main class="welcome">
  <img class="hero" src="Ale%20portada%20final.jpeg" alt="Álex en el Mercado de los Verbos, con acceso para entrar al Mercado">
  <a id="enterBtn" class="enter" href="index.html" aria-label="Entrar al Mercado"></a>
</main>
<script>
const enter=document.getElementById('enterBtn');
enter.href='index.html'+location.search;
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
</script>
</body>
</html>
