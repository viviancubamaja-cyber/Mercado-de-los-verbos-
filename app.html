<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado de los Verbos</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" type="image/png" href="alex-icon-192.png">
<link rel="apple-touch-icon" href="alex-icon-192.png">
<meta name="theme-color" content="#7b4b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mercado Verbos">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#2b241b;background:#f7e8a7}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:clamp(14px,3vw,30px);background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.72),transparent 34%),linear-gradient(145deg,#fff6cf 0%,#f9e292 52%,#f5d56c 100%)}.card{width:min(760px,96vw);background:rgba(255,251,238,.96);border:4px solid #7b4b20;border-radius:32px;padding:clamp(16px,3vw,30px);text-align:center;box-shadow:0 20px 55px rgba(83,48,16,.24)}.hero{display:block;width:100%;max-height:52vh;object-fit:contain;object-position:center;border-radius:24px;border:3px solid #e1b86a;box-shadow:0 10px 25px rgba(80,45,12,.16);background:#fffaf0}h1{color:#7b2d13;font-size:clamp(34px,6vw,58px);line-height:1.05;margin:18px 0 8px;font-weight:1000}.lead{margin:0 auto;max-width:620px;color:#5b351e;font-weight:850;font-size:clamp(17px,2.3vw,23px);line-height:1.35}.actions{display:grid;gap:12px;margin:22px auto 0;max-width:620px}button,a{font:inherit;font-weight:1000;font-size:clamp(18px,2.4vw,24px);border-radius:18px;padding:16px 20px;cursor:pointer;text-decoration:none}.enter{display:block;background:linear-gradient(#ffe59a,#ffd365);color:#351d09;border:3px solid #8b541f;box-shadow:0 6px 0 #8b541f;transition:.12s transform,.12s box-shadow}.enter:hover{transform:translateY(-2px);box-shadow:0 8px 0 #8b541f}.enter:active{transform:translateY(3px);box-shadow:0 3px 0 #8b541f}.install{background:#198754;color:white;border:0;box-shadow:0 6px 0 #0f5132}.install[hidden]{display:none}.small{max-width:620px;margin:18px auto 0;font-size:clamp(13px,1.7vw,16px);color:#66513c;line-height:1.45}@media(max-height:760px) and (min-width:700px){.card{width:min(980px,96vw);display:grid;grid-template-columns:minmax(320px,1.05fr) minmax(330px,.95fr);gap:26px;align-items:center;text-align:center}.hero{max-height:82vh}.content{display:flex;flex-direction:column;justify-content:center}}</style>
</head>
<body>
<main class="card">
  <img class="hero" src="alex-mercado-portada-v2.jpg?v=2" alt="Álex entrando al Mercado de los Verbos">
  <div class="content">
    <h1>Mercado de los Verbos</h1>
    <p class="lead">Aprende inglés comprando letras y viajando por el mercado.</p>
    <div class="actions">
      <button id="installBtn" class="install" hidden>📲 Instalar Mercado de los Verbos</button>
      <a id="enterBtn" class="enter" href="index.html">🧺 Entrar al Mercado</a>
    </div>
    <p class="small">Si has llegado mediante un código familiar, se conservará al entrar al Mercado. La instalación no sustituye el código del alumno: solo crea el acceso directo.</p>
  </div>
</main>
<script>
const enter=document.getElementById('enterBtn');
enter.href='index.html'+location.search;
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false;});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;installBtn.hidden=true;});
window.addEventListener('appinstalled',()=>{installBtn.hidden=true;});
</script>
</body>
</html>
