<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercado de los Verbos</title>
<link rel="manifest" href="site.webmanifest">
<link rel="icon" type="image/png" href="alex-icon-192.png">
<link rel="apple-touch-icon" href="alex-icon-192.png">
<meta name="theme-color" content="#7b4b20">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mercado Verbos">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#2b241b;background:#fff7df}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#fff7df,#ffe6a8)}.card{width:min(540px,94vw);background:#fffaf0;border:4px solid #7b4b20;border-radius:30px;padding:28px;text-align:center;box-shadow:0 18px 50px #0003}.icon{width:min(220px,55vw);height:auto;border-radius:28px;box-shadow:0 10px 28px #0002}h1{color:#7b2d13;font-size:clamp(30px,7vw,46px);margin:18px 0 6px}.lead{font-weight:800;font-size:18px;line-height:1.4}.actions{display:grid;gap:12px;margin-top:20px}button,a{font:inherit;font-weight:900;font-size:18px;border-radius:18px;padding:14px 18px;cursor:pointer;text-decoration:none}.enter{background:#ffe08a;color:#351d09;border:3px solid #8b541f;box-shadow:0 6px 0 #8b541f}.install{background:#198754;color:white;border:0;box-shadow:0 6px 0 #0f5132}.install[hidden]{display:none}.small{font-size:14px;color:#66513c;margin-top:18px;line-height:1.45}
</style>
</head>
<body>
<main class="card">
<img class="icon" src="alex-icon-512.png" alt="Álex entrando al Mercado de los Verbos">
<h1>Mercado de los Verbos</h1>
<p class="lead">Instala el Mercado y tendrás a Álex como acceso directo en tu ordenador, móvil o tablet.</p>
<div class="actions">
<button id="installBtn" class="install" hidden>📲 Instalar Mercado de los Verbos</button>
<a id="enterBtn" class="enter" href="index.html">🧺 Entrar al Mercado</a>
</div>
<p class="small">Si has llegado mediante un código familiar, se conservará al entrar al Mercado. La instalación no sustituye el código del alumno: solo crea el acceso directo.</p>
</main>
<script>
const enter=document.getElementById('enterBtn');
enter.href='index.html'+location.search;
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{});}
let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false;});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;installBtn.hidden=true;});
window.addEventListener('appinstalled',()=>{installBtn.hidden=true;});
</script>
</body>
</html>
