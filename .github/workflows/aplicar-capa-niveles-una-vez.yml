name: Aplicar capa estable a los niveles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-capa-niveles-una-vez.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Añadir seguridad y navegación sin modificar el motor
        shell: python
        run: |
          from pathlib import Path
          files = [
              Path("nivel1_libro1_test1.html"),
              Path("nivel2_libro2_test2.html"),
              Path("nivel3_libro3_test3.html"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              additions = []
              if "secure_guard.js" not in text:
                  additions.append('<script src="access_control.js"></script><script src="secure_guard.js"></script>')
              if "market_navigation.js" not in text:
                  additions.append('<link rel="stylesheet" href="market_navigation.css"><script src="market_navigation.js" defer></script>')
              if additions:
                  marker = "<head>"
                  if marker not in text:
                      raise RuntimeError(f"No se encontró <head> en {path}")
                  text = text.replace(marker, marker + "\n" + "\n".join(additions), 1)
                  path.write_text(text, encoding="utf-8", newline="")
      - name: Guardar cambio mínimo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nivel1_libro1_test1.html nivel2_libro2_test2.html nivel3_libro3_test3.html
          if git diff --cached --quiet; then
            echo "Los niveles ya tenían la capa estable."
          else
            git commit -m "Conectar niveles estables con navegación y limpieza visual"
            git push
          fi
