<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Level 3 Certificate · The Verb Market</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#f6eddb;font-family:Georgia,'Times New Roman',serif;color:#173b21}
  .toolbar{height:54px;display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 10px;position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);box-shadow:0 3px 14px rgba(0,0,0,.12);font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
  .toolbar button{border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:1000;cursor:pointer;background:#8a2c17;color:white;box-shadow:0 3px 0 #3b1709}
  .toolbar .hint{font-size:13px;font-weight:800;color:#6b4a26}
  .stage{min-height:calc(100dvh - 54px);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
  .page{width:min(98vw,calc((100dvh - 78px)*1.5));aspect-ratio:3/2;position:relative;background:#fff4d6;box-shadow:0 14px 34px rgba(0,0,0,.18);overflow:hidden}
  .diploma-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .field{position:absolute;z-index:3;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;white-space:nowrap;color:#111;pointer-events:none;background:transparent!important;box-shadow:none!important;border:0!important}
  .student-name{left:42.8%;top:40.9%;width:37.0%;height:5.4%;font-size:clamp(17px,2.5vw,33px);font-weight:900;letter-spacing:.015em;text-transform:uppercase;font-family:Georgia,'Times New Roman',serif;color:#143f22;text-shadow:none}
  .grade-value{left:64.9%;top:67.28%;width:5.2%;height:2.7%;font-size:clamp(11px,1.25vw,17px);font-weight:900;font-family:Georgia,'Times New Roman',serif;color:#102d18;text-shadow:none}
  .date-value{left:68.9%;top:78.55%;width:11.8%;height:2.5%;font-size:clamp(10px,1.1vw,15px);font-weight:900;color:#111;font-family:Georgia,'Times New Roman',serif;text-shadow:none}
  .teacher-value{left:47.0%;top:77.0%;width:12.2%;height:3.4%;font-size:clamp(9px,1.05vw,14px);font-weight:700;font-style:italic;font-family:Georgia,'Times New Roman',serif;color:#111;background:#f6e5c9!important;border-bottom:1px solid #63482a!important;overflow:hidden;text-overflow:ellipsis;padding-top:.25%;}
  @page{size:A4 landscape;margin:0}
  @media print{
    html,body{width:297mm;height:210mm;background:white!important;overflow:hidden}
    .toolbar{display:none!important}
    .stage{padding:0;width:297mm;height:210mm;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:white!important}
    .page{width:297mm;height:198mm;aspect-ratio:3/2;box-shadow:none;background:white!important;overflow:hidden}
    .diploma-img,.field{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .student-name{font-size:21pt}
    .grade-value{font-size:10.5pt}
    .date-value{font-size:9.8pt}
    .teacher-value{font-size:9.4pt;background:#f6e5c9!important;border-bottom:0.7pt solid #63482a!important}
  }
</style>
<link rel="stylesheet" href="mobile-responsive.css">
</head>
<body>
<div class="toolbar">
  <button onclick="window.print()">🖨 Print / Save PDF</button>
  <button onclick="window.close()">← Close</button>
  <span class="hint">A4 landscape · Level 3 official certificate</span>
</div>
<main class="stage">
  <section class="page" aria-label="Level 3 official certificate">
    <img class="diploma-img" src="gold_level3_official.png" alt="Official Verb Market Level 3 diploma">
    <div id="studentName" class="field student-name"></div>
    <div id="averageGrade" class="field grade-value"></div>
    <div id="certificateDate" class="field date-value"></div>
    <div id="teacherName" class="field teacher-value"></div>
  </section>
</main>
<script>
(function(){
  const params = new URLSearchParams(location.search);
  function first(...keys){
    for(const k of keys){ const v=params.get(k); if(v && v.trim()) return v.trim(); }
    return '';
  }
  const name = first('name','student','alumno','nombre') || 'STUDENT';
  const gradeRaw = first('grade','average','avg','nota','media');
  const dateRaw = first('date','fecha') || new Date().toLocaleDateString('en-GB');
  const teacherRaw = first('teacher','profesor','professora') || 'Teacher';
  const grade = gradeRaw ? gradeRaw.replace('/10','').replace('/ 10','').trim() : '';
  const nameBox = document.getElementById('studentName');
  const cleanName = name.toUpperCase();
  nameBox.textContent = cleanName;
  if (cleanName.length > 24) nameBox.style.fontSize = 'clamp(12px,1.8vw,24px)';
  else if (cleanName.length > 17) nameBox.style.fontSize = 'clamp(14px,2.0vw,27px)';
  else if (cleanName.length > 10) nameBox.style.fontSize = 'clamp(16px,2.25vw,30px)';
  document.getElementById('averageGrade').textContent = grade;
  document.getElementById('certificateDate').textContent = dateRaw;
  document.getElementById('teacherName').textContent = teacherRaw;
})();
</script>
</body>
</html>
